name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly security scan

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

jobs:
  # Code Quality & Testing
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Lint with clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --release

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin --locked

    - name: Check test coverage
      # Floor sits a few points under the measured baseline (~86% line
      # coverage as of this writing) — enough slack that routine changes
      # don't flake the gate, tight enough that a real drop still fails CI.
      # Raise this as coverage grows; don't lower it to make a failing PR
      # pass. `--release` matches the profile "Run tests" above already
      # verified — without it this gate gets its own separate debug build,
      # which can diverge from (and therefore not actually guard) what
      # `cargo test --release` just proved passes.
      run: cargo tarpaulin --release --fail-under 80 --out Stdout

  # Security Analysis
  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run cargo audit
      # Fails the job on a known advisory. To accept one deliberately, add an
      # explicit `--ignore RUSTSEC-YYYY-NNNN` here with a comment saying why —
      # do not restore `|| true`, which silently discarded every finding.
      run: cargo audit

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Frontend Testing
  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests with coverage
      # `test:coverage` already runs the full suite (`vitest run --coverage`
      # is a superset of `vitest run`) and enforces the thresholds in
      # vite.config.ts — a separate plain `npm test` step first would just
      # rerun the same suite for no added safety.
      run: |
        cd frontend
        npm run test:coverage

    - name: Type-check
      run: |
        cd frontend
        npx tsc --noEmit

  # Frontend Build & Deploy
  frontend:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./frontend/build

  # Deploy to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Dependency Review (for PRs only)
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4

  # Release (on main push with version tags)
  release:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build release binary
      run: cargo build --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        generate_release_notes: true
        files: |
          target/release/codevis
          README.md
